<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập bệnh nhân</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #e0f0ff, #f4f7fc); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
    .card-login { max-width: 420px; width: 100%; border: none; border-radius: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); padding: 30px; background: white; }
    .btn-primary { border-radius: 12px; padding: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card card-login">
    <div class="text-center mb-4">
      <i class="fas fa-eye text-primary" style="font-size: 3rem;"></i>
      <h4 class="mt-2">Phòng khám Mắt</h4>
      <p class="text-muted">Đăng nhập cổng bệnh nhân</p>
    </div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Số điện thoại</label>
        <input type="text" class="form-control" id="sdt" placeholder="0912345678" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Mật khẩu</label>
        <input type="password" class="form-control" id="matKhau" placeholder="Mật khẩu mặc định: 123456" required>
      </div>
      <div id="loginMsg" class="mb-3"></div>
      <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i> Đăng nhập</button>
    </form>
    <p class="text-center text-muted small mt-3">Mật khẩu mặc định: <strong>123456</strong></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const sdt = document.getElementById('sdt').value.trim();
      const matKhau = document.getElementById('matKhau').value.trim();
      const msg = document.getElementById('loginMsg');

      if (!sdt || !matKhau) {
        msg.innerHTML = '<div class="alert alert-warning">Vui lòng nhập đầy đủ thông tin</div>';
        return;
      }

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sdt, matKhau })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('patient', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          msg.innerHTML = `<div class="alert alert-danger">❌ ${data.error}</div>`;
        }
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-danger">❌ Lỗi kết nối: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
