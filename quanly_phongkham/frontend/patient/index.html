<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập bệnh nhân</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fc; display: flex; align-items: center; min-height: 100vh; }
    .card-login { max-width: 420px; margin: auto; border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="card card-login p-4">
    <h4 class="text-center mb-4"><i class="fas fa-user-md text-primary"></i> Cổng thông tin bệnh nhân</h4>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Số điện thoại</label>
        <input type="text" class="form-control" id="sdt" placeholder="Số điện thoại" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" class="form-control" id="matKhau" placeholder="Mật khẩu" required>
      </div>
      <div id="loginMsg" class="mb-3"></div>
      <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
    </form>
    <p class="text-center text-muted small mt-3">Mật khẩu mặc định: 123456</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const sdt = document.getElementById('sdt').value.trim();
      const matKhau = document.getElementById('matKhau').value.trim();
      const msg = document.getElementById('loginMsg');

      if (!sdt || !matKhau) {
        msg.innerHTML = '<div class="alert alert-warning">Vui lòng nhập đầy đủ thông tin</div>';
        return;
      }

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sdt, matKhau })
            });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('patient', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          msg.innerHTML = `<div class="alert alert-danger">❌ ${data.error}</div>`;
        }
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-danger">❌ Lỗi kết nối: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
