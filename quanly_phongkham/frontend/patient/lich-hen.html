<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch hẹn của tôi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fc; }
    .sidebar { background: white; min-height: 100vh; box-shadow: 2px 0 10px rgba(0,0,0,0.05); padding-top: 20px; }
    .sidebar .nav-link { color: #2c3e50; font-weight: 500; padding: 12px 20px; border-radius: 10px; margin: 4px 10px; }
    .sidebar .nav-link:hover { background: #e9f0fa; }
    .sidebar .nav-link i { width: 24px; }
    .main-content { padding: 30px; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 d-none d-md-block sidebar">
      <div class="text-center mb-4">
        <h5><i class="fas fa-user-circle text-primary"></i> <span id="patientName">BN</span></h5>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-chart-pie"></i> Tổng quan</a></li>
        <li class="nav-item"><a class="nav-link active" href="lich-hen.html"><i class="fas fa-calendar-check"></i> Lịch hẹn</a></li>
        <li class="nav-item"><a class="nav-link" href="dat-lich.html"><i class="fas fa-calendar-plus"></i> Đặt lịch</a></li>
        <li class="nav-item"><a class="nav-link" href="lich-su-kham.html"><i class="fas fa-history"></i> Lịch sử khám</a></li>
        <li class="nav-item"><a class="nav-link" href="hoa-don.html"><i class="fas fa-file-invoice"></i> Hóa đơn</a></li>
        <li class="nav-item"><span class="nav-link text-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</span></li>
      </ul>
    </nav>

    <main class="col-md-10 ms-sm-auto px-md-4 main-content">
      <h3><i class="fas fa-calendar-check text-primary"></i> Lịch hẹn của tôi</h3>
      <div id="appointmentList" class="mt-3"></div>
    </main>
  </div>
</div>
<script>
  const user = JSON.parse(localStorage.getItem('patient'));
  if (!user) window.location.href = 'index.html';
  document.getElementById('patientName').textContent = user.HoTen;

  async function loadAppointments() {
    try {
      const res = await fetch('http://localhost:5000/api/patient/lich-hen', {
        headers: { 'x-mabn': user.MaBN }
      });
      const data = await res.json();
      const container = document.getElementById('appointmentList');
      if (data.length === 0) {
        container.innerHTML = '<p class="text-muted">Chưa có lịch hẹn</p>';
        return;
      }
      container.innerHTML = data.map(l => `
        <div class="border p-3 mb-2 rounded bg-white d-flex justify-content-between align-items-center">
          <div>
            <strong>Bác sĩ:</strong> ${l.ten_bac_si}<br>
            <strong>Thời gian:</strong> ${new Date(l.ThoiGianBatDau).toLocaleString('vi-VN')} - ${new Date(l.ThoiGianKetThuc).toLocaleString('vi-VN')}
            <strong>Ca:</strong> ${l.CaSo}<br>
            <span class="badge bg-${l.TrangThai === 'Đã khám' ? 'success' : l.TrangThai === 'Đang khám' ? 'warning' : l.TrangThai === 'Đã hủy' ? 'danger' : 'secondary'}">${l.TrangThai}</span>
          </div>
          <div>
            ${['Chờ khám', 'Đang khám'].includes(l.TrangThai) ? 
              `<button class="btn btn-danger btn-sm" onclick="huyLich(${l.MaLH})"><i class="fas fa-times"></i> Hủy</button>` : 
              ``
            }
          </div>
        </div>
      `).join('');
    } catch (err) {
      document.getElementById('appointmentList').innerHTML = '<p class="text-danger">Lỗi tải dữ liệu</p>';
    }
  }

  async function huyLich(maLH) {
    if (!confirm('Bạn có chắc muốn hủy lịch hẹn này?')) return;
    try {
      const res = await fetch(`http://localhost:5000/api/patient/huy-lich/${maLH}`, {
        method: 'PUT',
        headers: { 'x-mabn': user.MaBN }
      });
      const data = await res.json();
      if (res.ok) {
        alert('Hủy lịch thành công');
        loadAppointments();
      } else {
        alert('Lỗi: ' + data.error);
      }
    } catch (err) {
      alert('Lỗi kết nối');
    }
  }

  function logout() {
    localStorage.removeItem('patient');
    window.location.href = 'index.html';
  }

  loadAppointments();
</script>
</body>
</html>
