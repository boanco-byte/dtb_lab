<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hóa đơn của tôi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fc; }
    .sidebar { background: white; min-height: 100vh; box-shadow: 2px 0 10px rgba(0,0,0,0.05); padding-top: 20px; }
    .sidebar .nav-link { color: #2c3e50; font-weight: 500; padding: 12px 20px; border-radius: 10px; margin: 4px 10px; }
    .sidebar .nav-link:hover { background: #e9f0fa; }
    .sidebar .nav-link i { width: 24px; }
    .main-content { padding: 30px; }
    .invoice-card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 12px; border-left: 4px solid #0d6efd; }
    .badge-status { padding: 6px 12px; border-radius: 20px; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 d-none d-md-block sidebar">
      <div class="text-center mb-4">
        <h5><i class="fas fa-user-circle text-primary"></i> <span id="patientName">BN</span></h5>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-chart-pie"></i> Tổng quan</a></li>
        <li class="nav-item"><a class="nav-link" href="lich-hen.html"><i class="fas fa-calendar-check"></i> Lịch hẹn</a></li>
        <li class="nav-item"><a class="nav-link" href="dat-lich.html"><i class="fas fa-calendar-plus"></i> Đặt lịch</a></li>
        <li class="nav-item"><a class="nav-link" href="lich-su-kham.html"><i class="fas fa-history"></i> Lịch sử khám</a></li>
        <li class="nav-item"><a class="nav-link active" href="hoa-don.html"><i class="fas fa-file-invoice"></i> Hóa đơn</a></li>
        <li class="nav-item"><span class="nav-link text-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</span></li>
      </ul>
    </nav>

    <main class="col-md-10 ms-sm-auto px-md-4 main-content">
      <h3><i class="fas fa-file-invoice text-primary"></i> Hóa đơn của tôi</h3>
      <div id="invoiceList" class="mt-3"></div>
    </main>
  </div>
</div>

<!-- Modal chi tiết hóa đơn -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Chi tiết hóa đơn #<span id="detailMaHD"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailBody">
        <p>Đang tải...</p>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS (bắt buộc để modal hoạt động) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const user = JSON.parse(localStorage.getItem('patient'));
  if (!user) window.location.href = 'index.html';
  document.getElementById('patientName').textContent = user.HoTen;

  let detailModal;

  document.addEventListener('DOMContentLoaded', function() {
    // Khởi tạo modal sau khi Bootstrap đã tải
    detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
    loadInvoices();
  });

  async function loadInvoices() {
    try {
      const res = await fetch('http://localhost:5000/api/patient/hoa-don', {
        headers: { 'x-mabn': user.MaBN }
      });
      if (!res.ok) throw new Error('Lỗi tải dữ liệu');
      const data = await res.json();
      const container = document.getElementById('invoiceList');
      if (data.length === 0) {
        container.innerHTML = '<p class="text-muted">Chưa có hóa đơn nào.</p>';
        return;
      }
      container.innerHTML = data.map(hd => `
        <div class="invoice-card d-flex justify-content-between align-items-center">
          <div>
            <strong>#${hd.MaHD}</strong>
            <span class="badge bg-${hd.TrangThai === 'Đã thanh toán' ? 'success' : 'warning'}">${hd.TrangThai}</span><br>
            <small class="text-muted">Ngày xuất: ${new Date(hd.NgayXuat).toLocaleDateString('vi-VN')}</small><br>
            <small>Khám ngày: ${new Date(hd.ngay_kham).toLocaleDateString('vi-VN')}</small>
          </div>
          <div class="text-end">
            <h5 class="text-primary">${new Intl.NumberFormat('vi-VN').format(hd.TongTien)} VND</h5>
            <button class="btn btn-sm btn-outline-info" onclick="xemChiTiet(${hd.MaHD})"><i class="fas fa-eye"></i> Chi tiết</button>
          </div>
        </div>
      `).join('');
    } catch (err) {
      document.getElementById('invoiceList').innerHTML = '<p class="text-danger">Lỗi tải dữ liệu</p>';
      console.error(err);
    }
  }

  async function xemChiTiet(maHD) {
    try {
      const res = await fetch(`http://localhost:5000/api/patient/hoa-don/${maHD}`, {
        headers: { 'x-mabn': user.MaBN }
      });
      if (!res.ok) throw new Error('Lỗi tải chi tiết');
      const data = await res.json();
      document.getElementById('detailMaHD').textContent = maHD;
      const body = document.getElementById('detailBody');
      body.innerHTML = `
        <div class="row mb-3">
          <div class="col-md-6"><strong>Ngày xuất:</strong> ${new Date(data.NgayXuat).toLocaleString('vi-VN')}</div>
          <div class="col-md-6"><strong>Trạng thái:</strong> ${data.TrangThai}</div>
          <div class="col-md-6"><strong>Tổng tiền:</strong> ${new Intl.NumberFormat('vi-VN').format(data.TongTien)} VND</div>
          <div class="col-md-6"><strong>Phương thức:</strong> ${data.PhuongThuc}</div>
          <div class="col-md-6"><strong>Tiền khám:</strong> ${new Intl.NumberFormat('vi-VN').format(data.TienKham)} VND</div>
          <div class="col-md-6"><strong>Tiền thuốc:</strong> ${new Intl.NumberFormat('vi-VN').format(data.TienThuoc)} VND</div>
        </div>
        ${data.chi_tiet && data.chi_tiet.length > 0 ? `
          <h6>Chi tiết đơn thuốc:</h6>
          <table class="table table-sm table-bordered">
            <thead><tr><th>Tên thuốc</th><th>Số lượng</th><th>Đơn giá</th><th>Liều dùng</th></tr></thead>
            <tbody>
              ${data.chi_tiet.map(d => `
                <tr>
                  <td>${d.TenThuoc}</td>
                  <td>${d.SoLuong} ${d.DonVi || ''}</td>
                  <td>${new Intl.NumberFormat('vi-VN').format(d.DonGia)} VND</td>
                  <td>${d.LieuDung || ''}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p class="text-muted">Không có chi tiết thuốc</p>'}
      `;
      detailModal.show();
    } catch (err) {
      alert('Lỗi tải chi tiết hóa đơn: ' + err.message);
    }
  }

  function logout() {
    localStorage.removeItem('patient');
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
