<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lịch mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; }
        .sidebar { background: white; min-height: 100vh; box-shadow: 2px 0 10px rgba(0,0,0,0.05); padding-top: 20px; }
        .sidebar .nav-link { color: #2c3e50; font-weight: 500; padding: 12px 20px; border-radius: 10px; margin: 4px 10px; }
        .sidebar .nav-link:hover { background: #e9f0fa; }
        .sidebar .nav-link i { width: 24px; }
        .main-content { padding: 30px; }
        .card-form { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar">
            <div class="text-center mb-4">
                <h5><i class="fas fa-user-circle text-primary"></i> <span id="patientName">BN</span></h5>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-chart-pie"></i> Tổng quan</a></li>
                <li class="nav-item"><a class="nav-link" href="lich-hen.html"><i class="fas fa-calendar-check"></i> Lịch hẹn</a></li>
                <li class="nav-item"><a class="nav-link active" href="dat-lich.html"><i class="fas fa-calendar-plus"></i> Đặt lịch</a></li>
                <li class="nav-item"><a class="nav-link" href="lich-su-kham.html"><i class="fas fa-history"></i> Lịch sử khám</a></li>
                <li class="nav-item"><span class="nav-link text-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</span></li>
            </ul>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 main-content">
            <h3><i class="fas fa-calendar-plus text-primary"></i> Đặt lịch hẹn mới</h3>
            <div class="card-form">
                <form id="datLichForm">
                    <div class="mb-3">
                        <label class="form-label">Thời gian <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control" id="thoiGian" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mã bác sĩ (để trống để tự động chọn)</label>
                        <input type="text" class="form-control" id="maBS" placeholder="VD: BS001">
                        <small class="text-muted">Hệ thống sẽ chọn bác sĩ rảnh nếu bạn để trống</small>
                    </div>
                    <div id="msg" class="mb-3"></div>
                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-check-circle"></i> Đặt lịch</button>
                </form>
            </div>
        </main>
    </div>
</div>
<script>
    const user = JSON.parse(localStorage.getItem('patient'));
    if (!user) window.location.href = 'index.html';
    document.getElementById('patientName').textContent = user.HoTen;

    document.getElementById('datLichForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const thoiGian = document.getElementById('thoiGian').value;
        const maBS = document.getElementById('maBS').value.trim() || null;
        if (!thoiGian) {
            document.getElementById('msg').innerHTML = '<div class="alert alert-warning">Vui lòng chọn thời gian</div>';
            return;
        }
        try {
            const res = await fetch('http://localhost:5000/api/patient/dat-lich', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-mabn': user.MaBN
                },
                body: JSON.stringify({ thoiGian, maBS })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('msg').innerHTML = '<div class="alert alert-success">✅ Đặt lịch thành công</div>';
                this.reset();
            } else {
                document.getElementById('msg').innerHTML = `<div class="alert alert-danger">❌ ${data.error}</div>`;
            }
        } catch {
            document.getElementById('msg').innerHTML = '<div class="alert alert-danger">❌ Lỗi kết nối</div>';
        }
    });

    function logout() {
        localStorage.removeItem('patient');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
