<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lịch mới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fc; }
    .sidebar { background: white; min-height: 100vh; box-shadow: 2px 0 10px rgba(0,0,0,0.05); padding-top: 20px; }
    .sidebar .nav-link { color: #2c3e50; font-weight: 500; padding: 12px 20px; border-radius: 10px; margin: 4px 10px; }
    .sidebar .nav-link:hover { background: #e9f0fa; }
    .sidebar .nav-link i { width: 24px; }
    .main-content { padding: 30px; }
    .card-form { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 d-none d-md-block sidebar">
      <div class="text-center mb-4">
        <h5><i class="fas fa-user-circle text-primary"></i> <span id="patientName">BN</span></h5>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-chart-pie"></i> Tổng quan</a></li>
        <li class="nav-item"><a class="nav-link" href="lich-hen.html"><i class="fas fa-calendar-check"></i> Lịch hẹn</a></li>
        <li class="nav-item"><a class="nav-link active" href="dat-lich.html"><i class="fas fa-calendar-plus"></i> Đặt lịch</a></li>
        <li class="nav-item"><a class="nav-link" href="lich-su-kham.html"><i class="fas fa-history"></i> Lịch sử khám</a></li>
        <li class="nav-item"><a class="nav-link" href="hoa-don.html"><i class="fas fa-file-invoice"></i> Hóa đơn</a></li>
        <li class="nav-item"><span class="nav-link text-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</span></li>
      </ul>
    </nav>

    <main class="col-md-10 ms-sm-auto px-md-4 main-content">
      <h3><i class="fas fa-calendar-plus text-primary"></i> Đặt lịch hẹn mới</h3>
      <div class="card-form">
        <form id="datLichForm">
          <div class="mb-3">
            <label class="form-label">Ngày khám <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="ngayKham" required>
            <small class="text-muted">Chọn ngày bạn muốn khám</small>
          </div>
          <div class="mb-3">
            <label class="form-label">Chọn ca (tùy chọn)</label>
            <select class="form-select" id="caSo">
              <option value="">-- Hệ thống tự chọn --</option>
              <option value="1">Ca 1: 08:00 - 09:30</option>
              <option value="2">Ca 2: 09:30 - 11:00</option>
              <option value="3">Ca 3: 11:00 - 12:30</option>
              <option value="4">Ca 4: 13:00 - 14:30</option>
              <option value="5">Ca 5: 14:30 - 16:00</option>
              <option value="6">Ca 6: 16:00 - 17:30</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Chọn bác sĩ (tùy chọn)</label>
            <select class="form-select" id="maBS">
              <option value="">-- Hệ thống tự chọn --</option>
            </select>
            <small class="text-muted">Nếu bạn không chọn, hệ thống sẽ tìm bác sĩ rảnh</small>
          </div>
          <div id="msg" class="mb-3"></div>
          <button type="submit" class="btn btn-primary w-100"><i class="fas fa-check-circle"></i> Đặt lịch</button>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_BASE = 'http://localhost:5000/api';
  const user = JSON.parse(localStorage.getItem('patient'));
  if (!user) {
    alert('Vui lòng đăng nhập lại');
    window.location.href = 'index.html';
  }
  document.getElementById('patientName').textContent = user.HoTen;

  // Load danh sách bác sĩ
  async function loadDoctors() {
    try {
      const res = await fetch(API_BASE + '/patient/bac-si', {
        headers: { 'x-mabn': user.MaBN }
      });
      const doctors = await res.json();
      const select = document.getElementById('maBS');
      doctors.forEach(doc => {
        const opt = document.createElement('option');
        opt.value = doc.MaBS;
        opt.textContent = `${doc.HoTen} (${doc.ChuyenKhoa || 'Mắt'})`;
        select.appendChild(opt);
      });
    } catch (err) {
      console.error('Lỗi tải danh sách bác sĩ:', err);
    }
  }

  // Đặt lịch
  document.getElementById('datLichForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const ngay = document.getElementById('ngayKham').value;
    const caSo = document.getElementById('caSo').value ? parseInt(document.getElementById('caSo').value) : null;
    const maBS = document.getElementById('maBS').value || null;
    const msg = document.getElementById('msg');

    if (!ngay) {
      msg.innerHTML = '<div class="alert alert-warning">Vui lòng chọn ngày khám</div>';
      return;
    }

    // Kiểm tra ngày không quá khứ
    const today = new Date().toISOString().split('T')[0];
    if (ngay < today) {
      msg.innerHTML = '<div class="alert alert-warning">⚠️ Không thể đặt lịch vào ngày đã qua</div>';
      return;
    }

    try {
      const res = await fetch(API_BASE + '/patient/dat-lich', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-mabn': user.MaBN
        },
        body: JSON.stringify({ ngay, caSo, maBS })
      });
      const data = await res.json();
      if (res.ok) {
        msg.innerHTML = `<div class="alert alert-success">✅ ${data.message}</div>`;
        this.reset();
        document.getElementById('caSo').value = '';
        document.getElementById('maBS').value = '';
      } else {
        msg.innerHTML = `<div class="alert alert-danger">❌ ${data.error}</div>`;
      }
    } catch (err) {
      msg.innerHTML = '<div class="alert alert-danger">❌ Lỗi kết nối</div>';
    }
  });

  function logout() {
    localStorage.removeItem('patient');
    window.location.href = 'index.html';
  }

  loadDoctors();
</script>
</body>
</html>
