<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .invoice-item { border-left: 4px solid #0d6efd; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="fas fa-credit-card text-primary"></i> Hóa đơn chưa thanh toán</h3>
        <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
    </div>

    <div class="card card-custom p-4" id="invoiceContainer">
        <div id="invoiceList" class="row g-3">
            <div class="col-12 text-center text-muted">Đang tải...</div>
        </div>
    </div>
</div>
<script>
    async function loadUnpaid() {
        try {
            const res = await fetch('http://localhost:5000/api/thanh-toan/chua-thanh-toan');
            const data = await res.json();
            const container = document.getElementById('invoiceList');
            if (data.length === 0) {
                container.innerHTML = `<div class="col-12 text-center text-muted">🎉 Không có hóa đơn chưa thanh toán</div>`;
                return;
            }
            container.innerHTML = data.map(hd => `
                <div class="col-md-6">
                    <div class="card invoice-item p-3">
                        <div class="d-flex justify-content-between">
                            <div>
                                <strong>${hd.ten_benh_nhan}</strong><br>
                                <small class="text-muted">Mã HD: ${hd.MaHD}</small><br>
                                <span class="badge bg-warning">${hd.TrangThai}</span>
                            </div>
                            <div class="text-end">
                                <h5 class="text-danger">${new Intl.NumberFormat('vi-VN').format(hd.TongTien)} VND</h5>
                                <button class="btn btn-success btn-sm" onclick="thanhToan(${hd.MaHD})">
                                    <i class="fas fa-check"></i> Thanh toán
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch {
            document.getElementById('invoiceList').innerHTML = `<div class="col-12 text-danger text-center">Lỗi tải dữ liệu</div>`;
        }
    }

    async function thanhToan(maHD) {
        if (!confirm('Xác nhận thanh toán hóa đơn này?')) return;
        try {
            const res = await fetch(`http://localhost:5000/api/thanh-toan/hoa-don/${maHD}`, { method: 'POST' });
            const data = await res.json();
            alert(data.message);
            loadUnpaid(); // reload
        } catch {
            alert('Lỗi thanh toán');
        }
    }

    loadUnpaid();
</script>
</body>
</html>
