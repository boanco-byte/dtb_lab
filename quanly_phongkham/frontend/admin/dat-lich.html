<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lịch hẹn - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; }
        .card-custom { max-width: 600px; margin: 40px auto; border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .btn-primary { background: #0d6efd; border: none; border-radius: 30px; padding: 10px 40px; font-weight: 600; }
        .btn-primary:hover { background: #0b5ed7; }
        .back-link { display: inline-block; margin: 20px 0 0 20px; color: #0d6efd; }
    </style>
</head>
<body>
<div class="container">
    <a href="danh-sach-lich.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <div class="card card-custom p-4 bg-white">
        <h4 class="text-center mb-3"><i class="fas fa-calendar-plus text-primary"></i> Đặt lịch hẹn</h4>
        <form id="formDatLich">
            <div class="mb-3">
                <label class="form-label fw-semibold">Mã bệnh nhân <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="maBN" placeholder="VD: BN001" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Thời gian <span class="text-danger">*</span></label>
                <input type="datetime-local" class="form-control" id="thoiGian" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Mã bác sĩ (để trống tự động)</label>
                <input type="text" class="form-control" id="maBS" placeholder="VD: BS001">
                <small class="text-muted">Hệ thống sẽ tự tìm bác sĩ rảnh</small>
            </div>
            <div id="msg" class="mb-3"></div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-check-circle"></i> Đặt lịch</button>
        </form>
    </div>
</div>
<script>
    document.getElementById('formDatLich').addEventListener('submit', async function(e) {
        e.preventDefault();
        const maBN = document.getElementById('maBN').value.trim();
        const thoiGian = document.getElementById('thoiGian').value;
        const maBS = document.getElementById('maBS').value.trim() || null;
        const msg = document.getElementById('msg');

        if (!maBN || !thoiGian) {
            msg.innerHTML = '<div class="alert alert-warning">Vui lòng điền đầy đủ thông tin</div>';
            return;
        }

        try {
            const res = await fetch('http://localhost:5000/api/lich-hen/dat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ maBN, thoiGian, maBS })
            });
            const data = await res.json();
            if (res.ok) {
                msg.innerHTML = `<div class="alert alert-success">✅ ${data.message}</div>`;
                // Chuyển về danh sách sau 1.5 giây
                setTimeout(() => {
                    window.location.href = 'danh-sach-lich.html';
                }, 1500);
            } else {
                msg.innerHTML = `<div class="alert alert-danger">❌ ${data.error}</div>`;
            }
        } catch {
            msg.innerHTML = '<div class="alert alert-danger">❌ Lỗi kết nối</div>';
        }
    });
</script>
</body>
</html>
