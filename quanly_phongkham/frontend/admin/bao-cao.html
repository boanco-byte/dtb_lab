<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo doanh thu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="fas fa-file-invoice text-primary"></i> Báo cáo doanh thu</h3>
        <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
    </div>

    <div class="card card-custom p-4">
        <div class="mb-3">
            <label class="form-label fw-semibold">Chọn tháng:</label>
            <input type="month" id="monthPicker" class="form-control w-auto d-inline-block" style="max-width:250px;">
            <button class="btn btn-primary ms-2" onclick="loadReport()"><i class="fas fa-chart-bar"></i> Xem</button>
        </div>
        <div id="reportResult">
            <p class="text-muted">Chọn tháng và nhấn Xem</p>
        </div>
    </div>
</div>
<script>
    async function loadReport() {
        const month = document.getElementById('monthPicker').value;
        if (!month) {
            document.getElementById('reportResult').innerHTML = '<p class="text-warning">Vui lòng chọn tháng</p>';
            return;
        }
        const [year, monthNum] = month.split('-');
        try {
            const res = await fetch('http://localhost:5000/api/thong-ke/doanh-thu-thang');
            const data = await res.json();
            const found = data.find(item => item.nam == year && item.thang == monthNum);
            if (found) {
                document.getElementById('reportResult').innerHTML = `
                    <div class="alert alert-success">
                        <h5><i class="fas fa-coins"></i> Doanh thu tháng ${monthNum}/${year}</h5>
                        <h3 class="text-primary">${new Intl.NumberFormat('vi-VN').format(found.tong)} VND</h3>
                    </div>
                `;
            } else {
                document.getElementById('reportResult').innerHTML = `<div class="alert alert-info">Không có doanh thu trong tháng này</div>`;
            }
        } catch {
            document.getElementById('reportResult').innerHTML = `<div class="alert alert-danger">Lỗi tải báo cáo</div>`;
        }
    }

    // Mặc định chọn tháng hiện tại
    document.addEventListener('DOMContentLoaded', function() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('monthPicker').value = `${year}-${month}`;
    });
</script>
</body>
</html>
