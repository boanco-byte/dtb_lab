<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm thuốc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; font-family: 'Segoe UI', sans-serif; }
        .card-custom { max-width: 600px; margin: 40px auto; border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.2); }
        .btn-primary { background: #0d6efd; border: none; border-radius: 30px; padding: 10px 40px; font-weight: 600; }
        .btn-primary:hover { background: #0b5ed7; }
        .back-link { display: inline-block; margin: 20px 0 0 20px; color: #0d6efd; }
    </style>
</head>
<body>
<div class="container">
    <a href="quan-ly-kho.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <div class="card card-custom p-4 bg-white">
        <h3 class="text-center mb-4"><i class="fas fa-pills text-primary"></i> Thêm thuốc mới</h3>
        <form id="formThemThuoc">
            <div class="mb-3">
                <label class="form-label fw-semibold">Mã thuốc <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="MaThuoc" placeholder="VD: T008" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên thuốc <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="TenThuoc" placeholder="VD: Ciprofloxacin 500mg" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Đơn vị</label>
                <input type="text" class="form-control" id="DonVi" placeholder="Viên" value="Viên">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Nhà sản xuất</label>
                <input type="text" class="form-control" id="NhaSX" placeholder="VD: DHG">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Đơn giá <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="DonGia" placeholder="15000" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Tồn kho</label>
                <input type="number" class="form-control" id="SoLuongTon" placeholder="0" value="0">
            </div>
            <div id="message" class="mb-3"></div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save"></i> Thêm thuốc</button>
        </form>
    </div>
</div>
<script>
    const API = 'http://localhost:5000/api/benh-nhan/thuoc';
    document.getElementById('formThemThuoc').addEventListener('submit', async function(e) {
        e.preventDefault();
        const MaThuoc = document.getElementById('MaThuoc').value.trim();
        const TenThuoc = document.getElementById('TenThuoc').value.trim();
        const DonVi = document.getElementById('DonVi').value.trim();
        const NhaSX = document.getElementById('NhaSX').value.trim();
        const DonGia = parseFloat(document.getElementById('DonGia').value);
        const SoLuongTon = parseInt(document.getElementById('SoLuongTon').value) || 0;

        if (!MaThuoc || !TenThuoc || isNaN(DonGia)) {
            document.getElementById('message').innerHTML = '<div class="alert alert-warning">Vui lòng điền đầy đủ thông tin bắt buộc (*)</div>';
            return;
        }

        const payload = { MaThuoc, TenThuoc, DonVi, NhaSX, DonGia, SoLuongTon };

        try {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            const msg = document.getElementById('message');
            if (res.ok) {
                msg.innerHTML = `<div class="alert alert-success">✅ Thêm thành công <strong>${data.TenThuoc}</strong> (Mã: ${data.MaThuoc})</div>`;
                this.reset();
            } else {
                msg.innerHTML = `<div class="alert alert-danger">❌ ${data.error || 'Không thêm được'}</div>`;
            }
        } catch (err) {
            document.getElementById('message').innerHTML = `<div class="alert alert-danger">❌ Lỗi kết nối: ${err.message}</div>`;
        }
    });
</script>
</body>
</html>
