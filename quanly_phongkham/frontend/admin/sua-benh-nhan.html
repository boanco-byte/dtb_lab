<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa bệnh nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; font-family: 'Segoe UI', sans-serif; }
        .card-custom { max-width: 600px; margin: 40px auto; border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.2); }
        .btn-primary { background: #0d6efd; border: none; border-radius: 30px; padding: 10px 40px; font-weight: 600; }
        .btn-primary:hover { background: #0b5ed7; }
        .back-link { display: inline-block; margin: 20px 0 0 20px; color: #0d6efd; }
    </style>
</head>
<body>
<div class="container">
    <a href="danh-sach-benh-nhan.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <div class="card card-custom p-4 bg-white">
        <h3 class="text-center mb-4"><i class="fas fa-user-edit text-primary"></i> Sửa bệnh nhân</h3>
        <form id="formSuaBN">
            <div class="mb-3">
                <label class="form-label fw-semibold">Mã bệnh nhân</label>
                <input type="text" class="form-control" id="MaBN" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Họ tên <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="HoTen" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Ngày sinh</label>
                <input type="date" class="form-control" id="NgaySinh">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Giới tính <span class="text-danger">*</span></label>
                <select class="form-select" id="GioiTinh" required>
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="SDT" required>
            </div>
            <div id="message" class="mb-3"></div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save"></i> Cập nhật</button>
        </form>
    </div>
</div>
<script>
    const API = 'http://localhost:5000/api/benh-nhan';
    const urlParams = new URLSearchParams(window.location.search);
    const maBN = urlParams.get('maBN');

    if (!maBN) {
        alert('Thiếu mã bệnh nhân');
        window.location.href = 'danh-sach-benh-nhan.html';
    }

    // Load thông tin bệnh nhân
    async function loadPatient() {
        try {
            const res = await fetch(`${API}/${maBN}`);
            if (!res.ok) throw new Error('Không tìm thấy bệnh nhân');
            const data = await res.json();
            document.getElementById('MaBN').value = data.MaBN;
            document.getElementById('HoTen').value = data.HoTen;
            document.getElementById('NgaySinh').value = data.NgaySinh || '';
            document.getElementById('GioiTinh').value = data.GioiTinh;
            document.getElementById('SDT').value = data.SDT || '';
        } catch (err) {
            alert('Lỗi tải dữ liệu: ' + err.message);
            window.location.href = 'danh-sach-benh-nhan.html';
        }
    }

    document.getElementById('formSuaBN').addEventListener('submit', async function(e) {
        e.preventDefault();
        const HoTen = document.getElementById('HoTen').value.trim();
        const NgaySinh = document.getElementById('NgaySinh').value;
        const GioiTinh = document.getElementById('GioiTinh').value;
        const SDT = document.getElementById('SDT').value.trim();

        if (!HoTen || !SDT) {
            document.getElementById('message').innerHTML = '<div class="alert alert-warning">Vui lòng điền đầy đủ thông tin bắt buộc (*)</div>';
            return;
        }

        const payload = { HoTen, NgaySinh, GioiTinh, SDT };

        try {
            const res = await fetch(`${API}/${maBN}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            const msg = document.getElementById('message');
            if (res.ok) {
                msg.innerHTML = `<div class="alert alert-success">✅ Cập nhật thành công <strong>${data.HoTen}</strong></div>`;
            } else {
                msg.innerHTML = `<div class="alert alert-danger">❌ ${data.error || 'Không cập nhật được'}</div>`;
            }
        } catch (err) {
            document.getElementById('message').innerHTML = `<div class="alert alert-danger">❌ Lỗi kết nối: ${err.message}</div>`;
        }
    });

    loadPatient();
</script>
</body>
</html>
