<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch làm việc bác sĩ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fc; font-family: 'Segoe UI', sans-serif; }
    .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    .slot { display: inline-block; padding: 4px 8px; margin: 2px; border-radius: 4px; font-size: 12px; min-width: 70px; text-align: center; border: 1px solid #ccc; }
    .slot.free { background: #d4edda; border-color: #28a745; }
    .slot.busy { background: #f8d7da; border-color: #dc3545; }
    .slot-label { font-weight: 600; min-width: 120px; display: inline-block; }
    .doctor-row { border-bottom: 1px solid #ddd; padding: 12px 0; }
    .doctor-name { font-weight: 600; font-size: 1.1rem; }
  </style>
</head>
<body>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="fas fa-calendar-alt text-primary"></i> Lịch làm việc bác sĩ</h3>
    <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
  </div>

  <div class="card card-custom p-4 mb-4">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label fw-semibold">Chọn ngày</label>
        <input type="date" id="ngayChon" class="form-control" value="">
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" onclick="loadLich()"><i class="fas fa-search"></i> Xem</button>
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-outline-secondary w-100" onclick="loadHomNay()"><i class="fas fa-calendar-day"></i> Hôm nay</button>
      </div>
    </div>
  </div>

  <div id="lichContainer">
    <p class="text-muted">Chọn ngày và nhấn Xem</p>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:5000/api/lich-hen';

  function loadHomNay() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('ngayChon').value = today;
    loadLich();
  }

  async function loadLich() {
    const ngay = document.getElementById('ngayChon').value;
    if (!ngay) {
      alert('Vui lòng chọn ngày');
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/lich-lam-viec?ngay=${ngay}`);
      if (!res.ok) throw new Error('Lỗi tải dữ liệu');
      const data = await res.json();
      renderLich(data, ngay);
    } catch (err) {
      document.getElementById('lichContainer').innerHTML = `<div class="alert alert-danger">Lỗi tải dữ liệu: ${err.message}</div>`;
    }
  }

  function renderLich(data, ngay) {
    const container = document.getElementById('lichContainer');
    if (!data || data.length === 0) {
      container.innerHTML = '<div class="alert alert-info">Không có bác sĩ làm việc trong ngày này.</div>';
      return;
    }
    let html = `<h5>📅 Ngày ${new Date(ngay).toLocaleDateString('vi-VN')}</h5><div class="mt-3">`;
    data.forEach(doc => {
      html += `<div class="doctor-row d-flex flex-wrap align-items-center">
        <div class="doctor-name me-4">${doc.HoTen}</div>
        <div>`;
      if (doc.slots && doc.slots.length > 0) {
        doc.slots.forEach(slot => {
          html += `<span class="slot ${slot.busy ? 'busy' : 'free'}">${slot.start}-${slot.end}</span> `;
        });
      } else {
        html += `<span class="text-muted">Không có ca làm việc</span>`;
      }
      html += `</div></div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  }

  // Mặc định chọn hôm nay
  document.addEventListener('DOMContentLoaded', function() {
    loadHomNay();
  });
</script>
</body>
</html>
