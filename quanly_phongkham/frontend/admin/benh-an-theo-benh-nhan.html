<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bệnh án của bệnh nhân</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fc; font-family: 'Segoe UI', sans-serif; }
    .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    .benh-an-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .benh-an-card .header { border-bottom: 2px solid #0d6efd; padding-bottom: 8px; margin-bottom: 12px; }
    .thuoc-item { background: #f8f9fa; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
    .btn-primary { background: #0d6efd; border: none; border-radius: 30px; padding: 8px 20px; font-weight: 600; }
    .btn-primary:hover { background: #0b5ed7; }
    .btn-outline-secondary { border-radius: 30px; }
  </style>
</head>
<body>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="fas fa-notes-medical text-primary"></i> Bệnh án của bệnh nhân</h3>
    <a href="danh-sach-benh-nhan.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
  </div>

  <div id="benhAnContainer">
    <div class="card card-custom p-4 text-center text-muted">
      <i class="fas fa-spinner fa-spin fa-3x mb-2"></i>
      <p>Đang tải dữ liệu...</p>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:5000/api/benh-nhan';

  // Lấy maBN từ URL
  const urlParams = new URLSearchParams(window.location.search);
  const maBN = urlParams.get('maBN');

  if (!maBN) {
    document.getElementById('benhAnContainer').innerHTML = `
      <div class="card card-custom p-4 text-center text-warning">
        <i class="fas fa-exclamation-triangle fa-3x mb-2"></i>
        <h5>Không có mã bệnh nhân</h5>
        <p>Vui lòng quay lại danh sách bệnh nhân và chọn một bệnh nhân.</p>
        <a href="danh-sach-benh-nhan.html" class="btn btn-primary mt-2">Quay lại danh sách bệnh nhân</a>
      </div>
    `;
  } else {
    // Tải dữ liệu bệnh nhân và bệnh án
    loadPatientData(maBN);
  }

  async function loadPatientData(maBN) {
    try {
      // Lấy thông tin bệnh nhân
      const patientRes = await fetch(`${API_BASE}/${maBN}`);
      if (!patientRes.ok) throw new Error('Không tìm thấy bệnh nhân');
      const patient = await patientRes.json();

      // Lấy bệnh án và đơn thuốc
      const res = await fetch(`${API_BASE}/${maBN}/benh-an`);
      if (!res.ok) throw new Error('Không thể tải bệnh án');
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('Dữ liệu bệnh án không hợp lệ');

      renderBenhAn(data, patient);
    } catch (err) {
      document.getElementById('benhAnContainer').innerHTML = `
        <div class="card card-custom p-4 text-center text-danger">
          <i class="fas fa-exclamation-circle fa-3x mb-2"></i>
          <h5>Lỗi tải dữ liệu</h5>
          <p>${err.message}</p>
          <a href="danh-sach-benh-nhan.html" class="btn btn-primary mt-2">Quay lại danh sách bệnh nhân</a>
        </div>
      `;
    }
  }

  function renderBenhAn(benhAns, patient) {
    const container = document.getElementById('benhAnContainer');
    if (!benhAns || benhAns.length === 0) {
      container.innerHTML = `
        <div class="card card-custom p-4 text-center">
          <i class="fas fa-inbox fa-3x mb-2 text-muted"></i>
          <h5><strong>${patient.HoTen}</strong> chưa có bệnh án nào.</h5>
          <p class="text-muted">Bệnh nhân chưa được khám hoặc chưa có hồ sơ.</p>
          <a href="danh-sach-benh-nhan.html" class="btn btn-primary mt-2">Quay lại danh sách bệnh nhân</a>
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div class="card card-custom p-4 mb-4">
        <h4><i class="fas fa-user-circle text-primary"></i> ${patient.HoTen} <small class="text-muted">(${patient.MaBN})</small></h4>
        <p class="text-muted mb-0">SĐT: ${patient.SDT || 'Chưa có'} | Giới tính: ${patient.GioiTinh}</p>
        <p class="text-muted">Ngày sinh: ${patient.NgaySinh ? new Date(patient.NgaySinh).toLocaleDateString('vi-VN') : 'Chưa có'}</p>
      </div>
      ${benhAns.map(ba => `
        <div class="benh-an-card">
          <div class="header d-flex justify-content-between">
            <h5 class="mb-0"><i class="fas fa-notes-medical"></i> Bệnh án #${ba.MaBA}</h5>
            <small class="text-muted">${new Date(ba.NgayTao).toLocaleDateString('vi-VN')}</small>
          </div>
          <div><strong>Bác sĩ:</strong> ${ba.ten_bac_si || 'Chưa có'}</div>
          <div><strong>Chẩn đoán:</strong> ${ba.ChanDoan || 'Chưa ghi'}</div>
          <div><strong>Triệu chứng:</strong> ${ba.TrieuChung || 'Chưa ghi'}</div>
          <div><strong>Ghi chú:</strong> ${ba.GhiChu || 'Không có'}</div>
          ${ba.don_thuoc && ba.don_thuoc.length > 0 ? `
            <div class="mt-3">
              <strong><i class="fas fa-pills text-primary"></i> Đơn thuốc:</strong>
              ${ba.don_thuoc.map(dt => `
                <div class="thuoc-item d-flex justify-content-between align-items-center">
                  <div>
                    <strong>${dt.TenThuoc}</strong>
                    <span class="badge bg-secondary">${dt.SoLuong} ${dt.DonVi || ''}</span>
                    ${dt.LieuDung ? `<span class="badge bg-info">${dt.LieuDung}</span>` : ''}
                    <br><small class="text-muted">${dt.HuongDan || ''}</small>
                  </div>
                  <span class="text-primary">${new Intl.NumberFormat('vi-VN').format(dt.DonGia)} VND</span>
                </div>
              `).join('')}
            </div>
          ` : `<div class="mt-2 text-muted">Không có đơn thuốc</div>`}
        </div>
      `).join('')}
    `;
  }
</script>
</body>
</html>
