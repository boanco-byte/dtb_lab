<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm bác sĩ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; font-family: 'Segoe UI', sans-serif; }
        .card-custom { max-width: 600px; margin: 40px auto; border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.2); }
        .btn-primary { background: #0d6efd; border: none; border-radius: 30px; padding: 10px 40px; font-weight: 600; }
        .btn-primary:hover { background: #0b5ed7; }
        .back-link { display: inline-block; margin: 20px 0 0 20px; color: #0d6efd; }
    </style>
</head>
<body>
<div class="container">
    <a href="danh-sach-bac-si.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <div class="card card-custom p-4 bg-white">
        <h3 class="text-center mb-4"><i class="fas fa-user-md text-primary"></i> Thêm bác sĩ mới</h3>
        <form id="formThemBS">
            <div class="mb-3">
                <label class="form-label fw-semibold">Mã bác sĩ <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="MaBS" placeholder="VD: BS005" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Họ tên <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="HoTen" placeholder="Nguyễn Văn E" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Số điện thoại</label>
                <input type="text" class="form-control" id="SDT" placeholder="0912345678">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Mã phòng khám</label>
                <input type="number" class="form-control" id="MaPK" placeholder="1">
                <small class="text-muted">Để trống nếu chưa phân công. Phòng khám phải tồn tại.</small>
            </div>
            <div id="message" class="mb-3"></div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save"></i> Thêm bác sĩ</button>
        </form>
    </div>
</div>
<script>
    const API = 'http://localhost:5000/api/benh-nhan/bac-si';
    document.getElementById('formThemBS').addEventListener('submit', async function(e) {
        e.preventDefault();
        const MaBS = document.getElementById('MaBS').value.trim();
        const HoTen = document.getElementById('HoTen').value.trim();
        const SDT = document.getElementById('SDT').value.trim();
        const MaPK = document.getElementById('MaPK').value ? parseInt(document.getElementById('MaPK').value) : null;

        if (!MaBS || !HoTen) {
            document.getElementById('message').innerHTML = '<div class="alert alert-warning">Vui lòng điền đầy đủ thông tin bắt buộc (*)</div>';
            return;
        }

        const payload = { MaBS, HoTen, SDT, MaPK };

        try {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            const msg = document.getElementById('message');
            if (res.ok) {
                msg.innerHTML = `<div class="alert alert-success">✅ Thêm thành công <strong>${data.HoTen}</strong> (Mã: ${data.MaBS})</div>`;
                this.reset();
            } else {
                msg.innerHTML = `<div class="alert alert-danger">❌ ${data.error || 'Không thêm được'}</div>`;
            }
        } catch (err) {
            document.getElementById('message').innerHTML = `<div class="alert alert-danger">❌ Lỗi kết nối: ${err.message}</div>`;
        }
    });
</script>
</body>
</html>
