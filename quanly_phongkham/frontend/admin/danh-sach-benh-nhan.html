<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bệnh nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; font-family: 'Segoe UI', sans-serif; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .table-hover tbody tr:hover { background-color: #eef3fa; }
        .search-box { max-width: 300px; }
        .btn-primary { background: #0d6efd; border: none; border-radius: 30px; padding: 8px 20px; font-weight: 600; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-outline-secondary { border-radius: 30px; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="fas fa-users text-primary"></i> Danh sách bệnh nhân</h3>
        <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
    </div>
    <div class="card card-custom p-4">
        <div class="d-flex justify-content-between mb-3">
            <div class="search-box">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 Tìm theo tên hoặc SĐT">
            </div>
            <div>
                <a href="them-benh-nhan.html" class="btn btn-primary"><i class="fas fa-plus"></i> Thêm bệnh nhân</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Mã BN</th>
                        <th>Họ tên</th>
                        <th>Ngày sinh</th>
                        <th>Giới tính</th>
                        <th>SĐT</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody">
                    <tr><td colspan="6" class="text-center text-muted">Đang tải...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
    const API = 'http://localhost:5000/api/benh-nhan';
    let patients = [];

    async function loadData() {
        try {
            const res = await fetch(API);
            let data = await res.json();
            data.sort((a, b) => b.MaBN.localeCompare(a.MaBN));
            patients = data.slice(0, 100);
            render(patients);
        } catch (e) {
            document.getElementById('patientTableBody').innerHTML = `<tr><td colspan="6" class="text-danger text-center">Lỗi tải dữ liệu</td></tr>`;
        }
    }

    function render(list) {
        const tbody = document.getElementById('patientTableBody');
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Không có bệnh nhân</td></tr>`;
            return;
        }
        tbody.innerHTML = list.map(p => `
            <tr>
                <td><span class="badge bg-secondary">${p.MaBN}</span></td>
                <td><strong>${p.HoTen}</strong></td>
                <td>${p.NgaySinh ? new Date(p.NgaySinh).toLocaleDateString('vi-VN') : '---'}</td>
                <td>${p.GioiTinh}</td>
                <td>${p.SDT}</td>
                <td>
                    <a href="benh-an-theo-benh-nhan.html?maBN=${p.MaBN}" class="btn btn-info btn-sm"><i class="fas fa-notes-medical"></i> Bệnh án</a>
                    <a href="sua-benh-nhan.html?maBN=${p.MaBN}" class="btn btn-warning btn-sm"><i class="fas fa-edit"></i></a>
                    <button class="btn btn-danger btn-sm" onclick="xoaBenhNhan('${p.MaBN}')"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    async function xoaBenhNhan(maBN) {
        if (!confirm(`Bạn có chắc muốn xóa bệnh nhân ${maBN}?`)) return;
        try {
            const res = await fetch(`${API}/${maBN}`, { method: 'DELETE' });
            const data = await res.json();
            if (res.ok) {
                alert('Xóa thành công');
                loadData();
            } else {
                alert('Lỗi: ' + data.error);
            }
        } catch (err) {
            alert('Lỗi kết nối');
        }
    }

    document.getElementById('searchInput').addEventListener('input', function() {
        const kw = this.value.trim().toLowerCase();
        if (!kw) return render(patients);
        const filtered = patients.filter(p => 
            p.HoTen.toLowerCase().includes(kw) || 
            (p.SDT && p.SDT.includes(kw))
        );
        render(filtered);
    });

    loadData();
</script>
</body>
</html>
