<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bệnh nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .table-hover tbody tr:hover { background-color: #eef3fa; }
        .search-box { max-width: 300px; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="fas fa-users text-primary"></i> Danh sách bệnh nhân</h3>
        <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
    </div>
    <div class="card card-custom p-4">
        <div class="d-flex justify-content-between mb-3">
            <div class="search-box"><input type="text" id="searchInput" class="form-control" placeholder="🔍 Tìm theo tên hoặc SĐT"></div>
            <span id="totalCount" class="text-muted align-self-center"></span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light"><tr><th>Mã BN</th><th>Họ tên</th><th>Ngày sinh</th><th>Giới tính</th><th>SĐT</th></tr></thead>
                <tbody id="patientTableBody"><tr><td colspan="5" class="text-center text-muted">Đang tải...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<script>
    const API = 'http://localhost:5000/api/benh-nhan';
    let patients = [];
    async function loadData() {
        try {
            const res = await fetch(API);
            patients = await res.json();
            render(patients);
        } catch (e) {
            document.getElementById('patientTableBody').innerHTML = `<tr><td colspan="5" class="text-danger text-center">Lỗi tải dữ liệu</td></tr>`;
        }
    }
    function render(list) {
        const tbody = document.getElementById('patientTableBody');
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Không có bệnh nhân</td></tr>`;
            document.getElementById('totalCount').textContent = '';
            return;
        }
        tbody.innerHTML = list.map(p => `
            <tr>
                <td><span class="badge bg-secondary">${p.MaBN}</span></td>
                <td><strong>${p.HoTen}</strong></td>
                <td>${p.NgaySinh || '---'}</td>
                <td>${p.GioiTinh}</td>
                <td>${p.SDT}</td>
            </tr>
        `).join('');
        document.getElementById('totalCount').textContent = `Tổng: ${list.length} bệnh nhân`;
    }
    document.getElementById('searchInput').addEventListener('input', function() {
        const kw = this.value.trim().toLowerCase();
        if (!kw) return render(patients);
        const filtered = patients.filter(p => p.HoTen.toLowerCase().includes(kw) || (p.SDT && p.SDT.includes(kw)));
        render(filtered);
    });
    loadData();
</script>
</body>
</html>
