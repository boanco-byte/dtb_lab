<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sửa bác sĩ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fc; }
    .card-custom { max-width: 600px; margin: 40px auto; border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.2); }
    .btn-primary { padding: 10px 40px; border-radius: 30px; font-weight: 600; }
    .back-link { display: inline-block; margin: 20px 0 0 20px; color: #0d6efd; }
  </style>
</head>
<body>
<div class="container">
  <a href="danh-sach-bac-si.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại</a>
  <div class="card card-custom p-4 bg-white">
    <h3 class="text-center mb-4"><i class="fas fa-user-edit text-primary"></i> Sửa bác sĩ</h3>
    <form id="formSuaBS">
      <div class="mb-3">
        <label class="form-label fw-semibold">Mã bác sĩ</label>
        <input type="text" class="form-control" id="MaBS" readonly>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Họ tên <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="HoTen" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Chuyên khoa <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="ChuyenKhoa" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Số điện thoại</label>
        <input type="text" class="form-control" id="SDT">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Mã phòng khám</label>
        <input type="number" class="form-control" id="MaPK" placeholder="1">
      </div>
      <div id="message" class="mb-3"></div>
      <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save"></i> Cập nhật</button>
    </form>
  </div>
</div>
<script>
  const API_BASE = 'http://localhost:5000/api/benh-nhan';
  const urlParams = new URLSearchParams(window.location.search);
  const maBS = urlParams.get('maBS');
  if (!maBS) {
    alert('Thiếu mã bác sĩ');
    window.location.href = 'danh-sach-bac-si.html';
  }

  // Load dữ liệu bác sĩ
  async function loadDoctor() {
    try {
      const res = await fetch(`${API_BASE}/bac-si`);
      const doctors = await res.json();
      const doctor = doctors.find(d => d.MaBS === maBS);
      if (!doctor) {
        alert('Không tìm thấy bác sĩ');
        window.location.href = 'danh-sach-bac-si.html';
        return;
      }
      document.getElementById('MaBS').value = doctor.MaBS;
      document.getElementById('HoTen').value = doctor.HoTen;
      document.getElementById('ChuyenKhoa').value = doctor.ChuyenKhoa;
      document.getElementById('SDT').value = doctor.SDT || '';
      document.getElementById('MaPK').value = doctor.MaPK || '';
    } catch (err) {
      alert('Lỗi tải dữ liệu');
    }
  }

  loadDoctor();

  // Submit form
  document.getElementById('formSuaBS').addEventListener('submit', async function(e) {
    e.preventDefault();
    const payload = {
      HoTen: document.getElementById('HoTen').value.trim(),
      ChuyenKhoa: document.getElementById('ChuyenKhoa').value.trim(),
      SDT: document.getElementById('SDT').value.trim(),
      MaPK: document.getElementById('MaPK').value ? parseInt(document.getElementById('MaPK').value) : null
    };
    try {
      const res = await fetch(`${API_BASE}/bac-si/${maBS}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      const msg = document.getElementById('message');
      if (res.ok) {
        msg.innerHTML = `<div class="alert alert-success">✅ Cập nhật thành công</div>`;
        setTimeout(() => window.location.href = 'danh-sach-bac-si.html', 1000);
      } else {
        msg.innerHTML = `<div class="alert alert-danger">❌ ${data.error || 'Không cập nhật được'}</div>`;
      }
    } catch (err) {
      document.getElementById('message').innerHTML = '<div class="alert alert-danger">❌ Lỗi kết nối</div>';
    }
  });
</script>
</body>
</html>
