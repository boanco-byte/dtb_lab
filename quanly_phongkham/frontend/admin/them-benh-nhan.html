<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm bệnh nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; }
        .card-custom { max-width: 600px; margin: 40px auto; border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.2); }
        .btn-primary { padding: 10px 40px; border-radius: 30px; font-weight: 600; }
        .back-link { display: inline-block; margin: 20px 0 0 20px; color: #0d6efd; }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại</a>
    <div class="card card-custom p-4 bg-white">
        <h3 class="text-center mb-4"><i class="fas fa-user-plus text-primary"></i> Thêm bệnh nhân mới</h3>
        <form id="formThemBN">
            <div class="mb-3"><label class="form-label fw-semibold">Mã bệnh nhân <span class="text-danger">*</span></label><input type="text" class="form-control" id="MaBN" placeholder="VD: BN003" required></div>
            <div class="mb-3"><label class="form-label fw-semibold">Họ tên <span class="text-danger">*</span></label><input type="text" class="form-control" id="HoTen" placeholder="Nguyễn Văn A" required></div>
            <div class="mb-3"><label class="form-label fw-semibold">Ngày sinh</label><input type="date" class="form-control" id="NgaySinh"></div>
            <div class="mb-3"><label class="form-label fw-semibold">Giới tính <span class="text-danger">*</span></label><select class="form-select" id="GioiTinh" required><option value="Nam">Nam</option><option value="Nữ">Nữ</option><option value="Khác">Khác</option></select></div>
            <div class="mb-3"><label class="form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label><input type="text" class="form-control" id="SDT" placeholder="0912345678" required></div>
            <div id="message" class="mb-3"></div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save"></i> Thêm bệnh nhân</button>
        </form>
    </div>
</div>
<script>
    const API = 'http://localhost:5000/api/benh-nhan';
    document.getElementById('formThemBN').addEventListener('submit', async function(e) {
        e.preventDefault();
        const payload = {
            MaBN: document.getElementById('MaBN').value.trim(),
            HoTen: document.getElementById('HoTen').value.trim(),
            NgaySinh: document.getElementById('NgaySinh').value,
            GioiTinh: document.getElementById('GioiTinh').value,
            SDT: document.getElementById('SDT').value.trim()
        };
        try {
            const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await res.json();
            const msg = document.getElementById('message');
            if (res.ok) {
                msg.innerHTML = `<div class="alert alert-success">✅ Thêm thành công <strong>${data.HoTen}</strong></div>`;
                this.reset();
            } else {
                msg.innerHTML = `<div class="alert alert-danger">❌ Lỗi: ${data.error || 'Không thêm được'}</div>`;
            }
        } catch (err) {
            document.getElementById('message').innerHTML = '<div class="alert alert-danger">❌ Lỗi kết nối</div>';
        }
    });
</script>
</body>
</html>
