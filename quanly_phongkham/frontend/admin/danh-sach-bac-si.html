<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bác sĩ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; font-family: 'Segoe UI', sans-serif; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .table-hover tbody tr:hover { background-color: #eef3fa; }
        .search-box { max-width: 300px; }
        .btn-primary { background: #0d6efd; border: none; border-radius: 30px; padding: 8px 20px; font-weight: 600; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-outline-secondary { border-radius: 30px; }
        .modal-header { border-bottom: 2px solid #0d6efd; }
        .lich-hen-item { border-left: 4px solid #0d6efd; padding-left: 12px; margin-bottom: 8px; }
        .lich-hen-item.busy { border-left-color: #dc3545; background-color: #fff5f5; }
        .lich-hen-item.free { border-left-color: #28a745; background-color: #f0fff4; }
        .badge-status { padding: 6px 12px; border-radius: 20px; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="fas fa-user-md text-primary"></i> Danh sách bác sĩ</h3>
        <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
    </div>
    <div class="card card-custom p-4">
        <div class="d-flex justify-content-between mb-3">
            <div class="search-box">
                <input type="text" id="searchDoctor" class="form-control" placeholder="🔍 Tìm theo tên hoặc mã BS">
            </div>
            <div>
                <a href="them-bac-si.html" class="btn btn-primary"><i class="fas fa-plus"></i> Thêm bác sĩ</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Mã BS</th>
                        <th>Họ tên</th>
                        <th>Chuyên khoa</th>
                        <th>SĐT</th>
                        <th>Phòng khám</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="doctorTableBody">
                    <tr><td colspan="6" class="text-center text-muted">Đang tải...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal xem lịch làm việc của bác sĩ -->
<div class="modal fade" id="scheduleModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-calendar-alt text-primary"></i> Lịch làm việc của bác sĩ <span id="doctorName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs" id="scheduleTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="ca-lam-viec-tab" data-bs-toggle="tab" data-bs-target="#ca-lam-viec" type="button" role="tab">Ca làm việc</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="lich-hen-tab" data-bs-toggle="tab" data-bs-target="#lich-hen" type="button" role="tab">Lịch hẹn</button>
                    </li>
                </ul>
                <div class="tab-content pt-3" id="scheduleTabContent">
                    <div class="tab-pane fade show active" id="ca-lam-viec" role="tabpanel">
                        <div id="caLamViecList"><p class="text-muted">Đang tải...</p></div>
                    </div>
                    <div class="tab-pane fade" id="lich-hen" role="tabpanel">
                        <div id="lichHenList"><p class="text-muted">Đang tải...</p></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let doctors = [];
    let scheduleModalInstance = null;

    document.addEventListener('DOMContentLoaded', function() {
        scheduleModalInstance = new bootstrap.Modal(document.getElementById('scheduleModal'));
        loadDoctors();
    });

    async function loadDoctors() {
        try {
            const res = await fetch('http://localhost:5000/api/benh-nhan/bac-si');
            let data = await res.json();
            data.sort((a, b) => b.MaBS.localeCompare(a.MaBS));
            doctors = data.slice(0, 100);
            render(doctors);
        } catch {
            document.getElementById('doctorTableBody').innerHTML = `<tr><td colspan="6" class="text-danger text-center">Lỗi tải dữ liệu</td></tr>`;
        }
    }

    function render(list) {
        const tbody = document.getElementById('doctorTableBody');
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Không có bác sĩ</td></tr>`;
            return;
        }
        tbody.innerHTML = list.map(d => `
            <tr>
                <td><span class="badge bg-primary">${d.MaBS}</span></td>
                <td><strong>${d.HoTen}</strong></td>
                <td>${d.ChuyenKhoa}</td>
                <td>${d.SDT}</td>
                <td>${d.TenPhong || 'Chưa phân công'}</td>
                <td>
                    <button class="btn btn-info btn-sm" onclick="xemLichLamViec('${d.MaBS}')"><i class="fas fa-calendar-alt"></i> Lịch làm việc</button>
                    <a href="sua-bac-si.html?maBS=${d.MaBS}" class="btn btn-warning btn-sm"><i class="fas fa-edit"></i></a>
                    <button class="btn btn-danger btn-sm" onclick="xoaBacSi('${d.MaBS}')"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    // Xem lịch làm việc
async function xemLichLamViec(maBS) {
    const doctor = doctors.find(d => d.MaBS === maBS);
    document.getElementById('doctorName').textContent = doctor ? `- ${doctor.HoTen}` : '';

    // Tính tuần hiện tại (từ Chủ nhật đến Thứ 7)
    const today = new Date();
    const startOfWeek = new Date(today);
    startOfWeek.setDate(today.getDate() - today.getDay()); // Chủ nhật
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 6); // Thứ 7
    const tuNgay = startOfWeek.toISOString().slice(0, 10);
    const denNgay = endOfWeek.toISOString().slice(0, 10);

    // Lấy ca làm việc trong tuần
    try {
        const resCal = await fetch(`http://localhost:5000/api/benh-nhan/bac-si/${maBS}/ca-lam-viec?tuNgay=${tuNgay}&denNgay=${denNgay}`);
        const calData = await resCal.json();
        const calContainer = document.getElementById('caLamViecList');
        if (calData.length === 0) {
            calContainer.innerHTML = '<p class="text-muted">Bác sĩ chưa có ca làm việc trong tuần này.</p>';
        } else {
            // Nhóm theo ngày
            const grouped = calData.reduce((acc, cur) => {
                const ngay = cur.NgayLam;
                if (!acc[ngay]) acc[ngay] = [];
                acc[ngay].push(cur);
                return acc;
            }, {});
            let html = `<div class="table-responsive"><table class="table table-sm table-bordered"><thead class="table-light"><tr><th>Ngày</th><th>Ca làm việc</th></tr></thead><tbody>`;
            // Sắp xếp các ngày từ tuNgay đến denNgay
            for (let d = new Date(tuNgay); d <= new Date(denNgay); d.setDate(d.getDate() + 1)) {
                const ngayStr = d.toISOString().slice(0, 10);
                const list = grouped[ngayStr] || [];
                const ngayDisplay = d.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
                if (list.length === 0) {
                    html += `<tr><td>${ngayDisplay}</td><td class="text-muted">Không có ca</td></tr>`;
                } else {
                    html += `<tr><td>${ngayDisplay}</td><td>${list.map(c => `${c.BatDau} - ${c.KetThuc}`).join(', ')}</td></tr>`;
                }
            }
            html += `</tbody></table></div>`;
            calContainer.innerHTML = html;
        }
    } catch (err) {
        document.getElementById('caLamViecList').innerHTML = `<p class="text-danger">Lỗi tải ca làm việc: ${err.message}</p>`;
    }

    // Lấy lịch hẹn trong tuần
    try {
        const resApp = await fetch(`http://localhost:5000/api/benh-nhan/bac-si/${maBS}/lich-hen?tuNgay=${tuNgay}&denNgay=${denNgay}`);
        const appData = await resApp.json();
        const appContainer = document.getElementById('lichHenList');
        if (appData.length === 0) {
            appContainer.innerHTML = '<p class="text-muted">Bác sĩ chưa có lịch hẹn trong tuần này.</p>';
        } else {
            // Nhóm theo ngày
            const grouped = appData.reduce((acc, cur) => {
                const ngay = cur.ThoiGianBatDau.slice(0, 10);
                if (!acc[ngay]) acc[ngay] = [];
                acc[ngay].push(cur);
                return acc;
            }, {});
            let html = `<div class="table-responsive"><table class="table table-sm table-bordered"><thead class="table-light"><tr><th>Ngày</th><th>Lịch hẹn</th></tr></thead><tbody>`;
            for (let d = new Date(tuNgay); d <= new Date(denNgay); d.setDate(d.getDate() + 1)) {
                const ngayStr = d.toISOString().slice(0, 10);
                const list = grouped[ngayStr] || [];
                const ngayDisplay = d.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
                if (list.length === 0) {
                    html += `<tr><td>${ngayDisplay}</td><td class="text-muted">Không có lịch hẹn</td></tr>`;
                } else {
                    html += `<tr><td>${ngayDisplay}</td><td>${list.map(l => `<div class="lich-hen-item ${l.TrangThai === 'Đã hủy' ? 'free' : 'busy'}"><strong>${l.ten_benh_nhan}</strong> (${new Date(l.ThoiGianBatDau).toLocaleTimeString('vi-VN')} - ${new Date(l.ThoiGianKetThuc).toLocaleTimeString('vi-VN')}) <span class="badge bg-${l.TrangThai === 'Đã khám' ? 'success' : l.TrangThai === 'Đang khám' ? 'warning' : l.TrangThai === 'Đã hủy' ? 'secondary' : 'danger'}">${l.TrangThai}</span></div>`).join('')}</td></tr>`;
                }
            }
            html += `</tbody></table></div>`;
            appContainer.innerHTML = html;
        }
    } catch (err) {
        document.getElementById('lichHenList').innerHTML = `<p class="text-danger">Lỗi tải lịch hẹn: ${err.message}</p>`;
    }

    scheduleModalInstance.show();
}

    async function xoaBacSi(maBS) {
        if (!confirm(`Xóa bác sĩ ${maBS}?`)) return;
        try {
            const res = await fetch(`http://localhost:5000/api/benh-nhan/bac-si/${maBS}`, { method: 'DELETE' });
            const data = await res.json();
            if (res.ok) {
                alert('Xóa thành công');
                loadDoctors();
            } else {
                alert('Lỗi: ' + data.error);
            }
        } catch {
            alert('Lỗi kết nối');
        }
    }

    document.getElementById('searchDoctor').addEventListener('input', function() {
        const kw = this.value.trim().toLowerCase();
        if (!kw) return render(doctors);
        const filtered = doctors.filter(d => 
            d.HoTen.toLowerCase().includes(kw) || 
            d.MaBS.toLowerCase().includes(kw)
        );
        render(filtered);
    });
</script>
</body>
</html>
