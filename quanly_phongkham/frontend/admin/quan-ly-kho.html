<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý kho thuốc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; font-family: 'Segoe UI', sans-serif; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .table-hover tbody tr:hover { background-color: #eef3fa; }
        .low-stock { background-color: #fff3cd !important; }
        .out-of-stock { background-color: #f8d7da !important; }
        .search-box { max-width: 300px; }
        .btn-primary { background: #0d6efd; border: none; border-radius: 30px; padding: 8px 20px; font-weight: 600; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-outline-secondary { border-radius: 30px; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="fas fa-pills text-primary"></i> Quản lý kho thuốc</h3>
        <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
    </div>
    <div class="card card-custom p-4">
        <div class="d-flex justify-content-between mb-3">
            <div class="search-box">
                <input type="text" id="searchMedicine" class="form-control" placeholder="🔍 Tìm theo mã hoặc tên thuốc">
            </div>
            <div>
                <a href="them-thuoc.html" class="btn btn-primary"><i class="fas fa-plus"></i> Thêm thuốc</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Mã thuốc</th>
                        <th>Tên thuốc</th>
                        <th>Đơn vị</th>
                        <th>Nhà sản xuất</th>
                        <th>Đơn giá</th>
                        <th>Tồn kho</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="medicineTableBody">
                    <tr><td colspan="8" class="text-center text-muted">Đang tải...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
    let medicines = [];

    async function loadMedicines() {
        try {
            const res = await fetch('http://localhost:5000/api/benh-nhan/thuoc');
            let data = await res.json();
            data.sort((a, b) => b.MaThuoc.localeCompare(a.MaThuoc));
            medicines = data.slice(0, 100);
            render(medicines);
        } catch {
            document.getElementById('medicineTableBody').innerHTML = `<tr><td colspan="8" class="text-danger text-center">Lỗi tải dữ liệu</td></tr>`;
        }
    }

    function render(list) {
        const tbody = document.getElementById('medicineTableBody');
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">Không có thuốc</td></tr>`;
            return;
        }
        tbody.innerHTML = list.map(m => {
            let status = 'Bình thường';
            let classRow = '';
            let badgeColor = 'success';
            if (m.SoLuongTon === 0) {
                status = 'Hết hàng';
                classRow = 'out-of-stock';
                badgeColor = 'danger';
            } else if (m.SoLuongTon <= 10) {
                status = 'Sắp hết';
                classRow = 'low-stock';
                badgeColor = 'warning';
            }
            return `
                <tr class="${classRow}">
                    <td><span class="badge bg-secondary">${m.MaThuoc}</span></td>
                    <td><strong>${m.TenThuoc}</strong></td>
                    <td>${m.DonVi}</td>
                    <td>${m.NhaSX || '---'}</td>
                    <td>${new Intl.NumberFormat('vi-VN').format(m.DonGia)} VND</td>
                    <td>${m.SoLuongTon}</td>
                    <td><span class="badge bg-${badgeColor}">${status}</span></td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="suaThuoc('${m.MaThuoc}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger btn-sm" onclick="xoaThuoc('${m.MaThuoc}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function suaThuoc(maThuoc) {
        alert('Chức năng sửa đang phát triển.');
    }

    function suaThuoc(maThuoc) {
        window.location.href = `sua-thuoc.html?maThuoc=${maThuoc}`;
    }

    async function xoaThuoc(maThuoc) {
        if (!confirm(`Xóa thuốc ${maThuoc}?`)) return;
        try {
            const res = await fetch(`http://localhost:5000/api/benh-nhan/thuoc/${maThuoc}`, { method: 'DELETE' });
            const data = await res.json();
            if (res.ok) {
                alert('Xóa thành công');
                loadMedicines();
            } else {
                alert('Lỗi: ' + data.error);
            }
        } catch {
            alert('Lỗi kết nối');
        }
    }

    document.getElementById('searchMedicine').addEventListener('input', function() {
        const kw = this.value.trim().toLowerCase();
        if (!kw) return render(medicines);
        const filtered = medicines.filter(m => 
            m.TenThuoc.toLowerCase().includes(kw) || 
            m.MaThuoc.toLowerCase().includes(kw)
        );
        render(filtered);
    });

    loadMedicines();
</script>
</body>
</html>
