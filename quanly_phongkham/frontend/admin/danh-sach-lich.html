<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách lịch hẹn - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f7fc; font-family: 'Segoe UI', sans-serif; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .table-hover tbody tr:hover { background-color: #eef3fa; }
        .btn-primary { background: #0d6efd; border: none; border-radius: 30px; padding: 8px 20px; font-weight: 600; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-outline-secondary { border-radius: 30px; }
        .filter-btn { cursor: pointer; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="fas fa-calendar-check text-primary"></i> Lịch hẹn</h3>
        <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
    </div>

    <div class="card card-custom p-4">
        <div class="d-flex gap-2 mb-3 flex-wrap">
            <button class="btn btn-outline-primary filter-btn active" data-filter="all">Tất cả</button>
            <button class="btn btn-outline-secondary filter-btn" data-filter="Chờ khám">Chờ khám</button>
            <button class="btn btn-outline-warning filter-btn" data-filter="Đang khám">Đang khám</button>
            <button class="btn btn-outline-success filter-btn" data-filter="Đã khám">Đã khám</button>
            <button class="btn btn-outline-danger filter-btn" data-filter="Đã hủy">Đã hủy</button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>BN</th>
                        <th>Bác sĩ</th>
                        <th>Bắt đầu</th>
                        <th>Kết thúc</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="lichTableBody">
                    <tr><td colspan="6" class="text-center text-muted">Đang tải...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allAppointments = [];
    let currentFilter = 'all';

    async function loadAppointments() {
        try {
            const res = await fetch('http://localhost:5000/api/lich-hen');
            allAppointments = await res.json();
            render(currentFilter);
        } catch {
            document.getElementById('lichTableBody').innerHTML = `<tr><td colspan="6" class="text-danger text-center">Lỗi tải</td></tr>`;
        }
    }

    function render(filter) {
        const filtered = filter === 'all' ? allAppointments : allAppointments.filter(a => a.TrangThai === filter);
        const tbody = document.getElementById('lichTableBody');
        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Không có lịch hẹn</td></tr>`;
            return;
        }
        tbody.innerHTML = filtered.map(l => {
            let actions = '';
            if (l.TrangThai === 'Chờ khám') {
                actions = `
                    <button class="btn btn-primary btn-sm" onclick="capNhatTrangThai(${l.MaLH}, 'Đang khám')">Bắt đầu</button>
                    <button class="btn btn-danger btn-sm" onclick="huyLich(${l.MaLH})">Hủy</button>
                `;
            } else if (l.TrangThai === 'Đang khám') {
                actions = `
                    <button class="btn btn-success btn-sm" onclick="capNhatTrangThai(${l.MaLH}, 'Đã khám')">Kết thúc</button>
                    <button class="btn btn-danger btn-sm" onclick="huyLich(${l.MaLH})">Hủy</button>
                `;
            } else if (l.TrangThai === 'Đã khám') {
                actions = `
                    <button class="btn btn-info btn-sm" onclick="lapBenhAn(${l.MaLH})">Lập bệnh án</button>
                `;
            } else {
                actions = '<span class="text-muted">—</span>';
            }

            return `
                <tr>
                    <td>${l.ten_benh_nhan}</td>
                    <td>${l.ten_bac_si}</td>
                    <td>${new Date(l.ThoiGianBatDau).toLocaleString('vi-VN')}</td>
                    <td>${new Date(l.ThoiGianKetThuc).toLocaleString('vi-VN')}</td>
                    <td><span class="badge bg-${l.TrangThai === 'Đã khám' ? 'success' : l.TrangThai === 'Đang khám' ? 'warning' : l.TrangThai === 'Đã hủy' ? 'danger' : 'secondary'}">${l.TrangThai}</span></td>
                    <td>${actions}</td>
                </tr>
            `;
        }).join('');
    }

    // ============================================================
    // HÀM CHUYỂN TRẠNG THÁI & HỦY LỊCH
    // ============================================================
    async function capNhatTrangThai(maLH, trangThai) {
        if (!confirm(`Chuyển lịch hẹn sang trạng thái "${trangThai}"?`)) return;
        try {
            const res = await fetch(`http://localhost:5000/api/lich-hen/${maLH}/trang-thai`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ trangThai })
            });
            const data = await res.json();
            if (res.ok) {
                alert('Cập nhật trạng thái thành công');
                loadAppointments();
            } else {
                alert('Lỗi: ' + data.error);
            }
        } catch (err) {
            alert('Lỗi kết nối');
        }
    }

    async function huyLich(maLH) {
        if (!confirm('Bạn có chắc muốn hủy lịch hẹn này?')) return;
        try {
            const res = await fetch(`http://localhost:5000/api/lich-hen/${maLH}/trang-thai`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ trangThai: 'Đã hủy' })
            });
            const data = await res.json();
            if (res.ok) {
                alert('Hủy lịch thành công');
                loadAppointments();
            } else {
                alert('Lỗi: ' + data.error);
            }
        } catch (err) {
            alert('Lỗi kết nối');
        }
    }

    // ============================================================
    // LẬP BỆNH ÁN
    // ============================================================
    async function lapBenhAn(maLH) {
        // Kiểm tra xem đã có bệnh án cho lịch hẹn này chưa
        try {
            const resCheck = await fetch(`http://localhost:5000/api/benh-an?maLH=${maLH}`);
            const existing = await resCheck.json();
            if (existing.length > 0) {
                alert('Bệnh án đã tồn tại cho lịch hẹn này!');
                return;
            }
        } catch (err) {
            // Nếu lỗi, vẫn cho phép tạo mới
        }

        // Hiển thị form nhập chẩn đoán, triệu chứng, ghi chú
        const chanDoan = prompt('Nhập chẩn đoán:');
        if (chanDoan === null) return; // hủy bỏ
        const trieuChung = prompt('Nhập triệu chứng (có thể bỏ trống):') || '';
        const ghiChu = prompt('Nhập ghi chú (có thể bỏ trống):') || '';

        try {
            const res = await fetch('http://localhost:5000/api/benh-an', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ MaLH: maLH, ChanDoan: chanDoan, TrieuChung: trieuChung, GhiChu: ghiChu })
            });
            const data = await res.json();
            if (res.ok) {
                alert('Tạo bệnh án thành công!');
                loadAppointments(); // reload danh sách
            } else {
                alert('Lỗi: ' + data.error);
            }
        } catch (err) {
            alert('Lỗi kết nối');
        }
    }

    // ============================================================
    // FILTER
    // ============================================================
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            render(currentFilter);
        });
    });

    loadAppointments();
</script>
</body>
</html>
