<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết bác sĩ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fc; font-family: 'Segoe UI', sans-serif; }
    .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    .table-hover tbody tr:hover { background-color: #eef3fa; }
    .badge-status { padding: 6px 12px; border-radius: 20px; }
    .busy-slot { background-color: #f8d7da !important; }
    .busy-slot .badge { background-color: #dc3545; }
    .btn-outline-secondary { border-radius: 30px; }
  </style>
</head>
<body>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="fas fa-user-md text-primary"></i> Chi tiết bác sĩ</h3>
    <a href="danh-sach-bac-si.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
  </div>

  <div id="doctorDetail">
    <div class="text-center text-muted">Đang tải...</div>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:5000/api/benh-nhan';
  const urlParams = new URLSearchParams(window.location.search);
  const maBS = urlParams.get('maBS');

  if (!maBS) {
    alert('Thiếu mã bác sĩ');
    window.location.href = 'danh-sach-bac-si.html';
  }

  async function loadDoctorDetail() {
    try {
      const res = await fetch(`${API_BASE}/bac-si/${maBS}/chi-tiet`);
      if (!res.ok) throw new Error('Không tìm thấy bác sĩ');
      const data = await res.json();
      renderDetail(data);
    } catch (err) {
      document.getElementById('doctorDetail').innerHTML = `<div class="alert alert-danger">Lỗi tải dữ liệu: ${err.message}</div>`;
    }
  }

  function renderDetail(doctor) {
    const container = document.getElementById('doctorDetail');

    // Nhóm lịch hẹn theo ngày
    const appointmentsByDate = {};
    doctor.lich_hen.forEach(lh => {
      const date = new Date(lh.ThoiGianBatDau).toISOString().split('T')[0];
      if (!appointmentsByDate[date]) appointmentsByDate[date] = [];
      appointmentsByDate[date].push(lh);
    });

    // Tạo danh sách các ngày có ca làm việc
    const workDates = doctor.ca_lam_viec.map(c => new Date(c.NgayLam).toISOString().split('T')[0]);

    let caHtml = '';
    if (doctor.ca_lam_viec.length === 0) {
      caHtml = '<p class="text-muted">Chưa có ca làm việc</p>';
    } else {
      caHtml = `
        <div class="table-responsive">
          <table class="table table-sm table-bordered">
            <thead class="table-light">
              <tr><th>Ngày</th><th>Bắt đầu</th><th>Kết thúc</th></tr>
            </thead>
            <tbody>
              ${doctor.ca_lam_viec.map(c => `
                <tr>
                  <td>${new Date(c.NgayLam).toLocaleDateString('vi-VN')}</td>
                  <td>${c.BatDau}</td>
                  <td>${c.KetThuc}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    let lichHtml = '';
    if (doctor.lich_hen.length === 0) {
      lichHtml = '<p class="text-muted">Chưa có lịch hẹn</p>';
    } else {
      lichHtml = `
        <div class="table-responsive">
          <table class="table table-sm table-bordered">
            <thead class="table-light">
              <tr><th>Ngày</th><th>Giờ</th><th>Bệnh nhân</th><th>Trạng thái</th><th>Ghi chú</th></tr>
            </thead>
            <tbody>
              ${doctor.lich_hen.map(lh => {
                const isBusy = workDates.includes(new Date(lh.ThoiGianBatDau).toISOString().split('T')[0]);
                return `
                  <tr class="${isBusy ? 'busy-slot' : ''}">
                    <td>${new Date(lh.ThoiGianBatDau).toLocaleDateString('vi-VN')}</td>
                    <td>${new Date(lh.ThoiGianBatDau).toLocaleTimeString('vi-VN')} - ${new Date(lh.ThoiGianKetThuc).toLocaleTimeString('vi-VN')}</td>
                    <td>${lh.ten_benh_nhan}</td>
                    <td><span class="badge bg-${lh.TrangThai === 'Đã khám' ? 'success' : lh.TrangThai === 'Đang khám' ? 'warning' : lh.TrangThai === 'Đã hủy' ? 'danger' : 'secondary'}">${lh.TrangThai}</span></td>
                    <td>${lh.GhiChu || ''}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    container.innerHTML = `
      <div class="card card-custom p-4 mb-4">
        <h4>${doctor.HoTen} <small class="text-muted">(${doctor.MaBS})</small></h4>
        <p><strong>Chuyên khoa:</strong> ${doctor.ChuyenKhoa}</p>
        <p><strong>SĐT:</strong> ${doctor.SDT || 'Chưa có'}</p>
        <p><strong>Phòng khám:</strong> ${doctor.TenPhong || 'Chưa phân công'}</p>
      </div>

      <div class="card card-custom p-4 mb-4">
        <h5><i class="fas fa-clock text-primary"></i> Ca làm việc</h5>
        ${caHtml}
      </div>

      <div class="card card-custom p-4">
        <h5><i class="fas fa-calendar-check text-primary"></i> Lịch hẹn <small class="text-muted">(các dòng màu đỏ là giờ đã có lịch hẹn)</small></h5>
        ${lichHtml}
      </div>
    `;
  }

  loadDoctorDetail();
</script>
</body>
</html>
